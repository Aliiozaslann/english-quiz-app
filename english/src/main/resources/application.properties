# Port ayarı (Render dinamik PORT atar)
server.port=${PORT:8087}

# PostgreSQL Bağlantısı (Render ortam değişkenlerinden beslenir, yoksa lokale düşer)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/englishapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Statik Dosyalar (HTML/CSS/JS)
spring.web.resources.static-locations=classpath:/static/